# Package metadata for kritva-sdk (KOS-SDK-002). The runtime has no dependency outside the Python standard library.
# Build tools are pinned here and in release/build-requirements.txt, never as runtime dependencies. The package
# version is not a contract version: each contract keeps its own version (see compatibility declarations, KOS-SDK-003).
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kritva-sdk"
dynamic = ["version"]
description = "Contract-first Python SDK for Kritva: typed models and validators over approved, versioned contracts (preview; no contract support is implemented yet)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Development Status :: 2 - Pre-Alpha",
]

[tool.setuptools]
include-package-data = false
packages = ["kritva_sdk"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
kritva_sdk = ["py.typed", "_schemas/sense/*.json", "_schemas/sense/*.md"]

[tool.setuptools.dynamic]
version = { attr = "kritva_sdk._version.__version__" }
